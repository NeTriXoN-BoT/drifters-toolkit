name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Get source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for directory in ("scripts", "tests"):
              for source in Path(directory).glob("*.py"):
                  ast.parse(source.read_text(encoding="utf-8-sig"), filename=str(source))
          PY
      - name: Check public-source boundaries
        run: python3 -B tests/public_source_privacy_tests.py
      - name: Check pinned decoder and browser inputs
        run: |
          python3 -B tests/archive_bootstrap_tests.py
          python3 -B tests/linux_dependency_tests.py
          python3 -B tests/qt_webengine_release_1_1_tests.py
      - name: Check shared interface behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for test in sorted(Path("tests").glob("ui*_tests.js")):
              if "browser" not in test.name:
                  subprocess.run(["node", str(test)], check=True)
          subprocess.run(["node", "tests/ui_smoke.js"], check=True)
          PY
